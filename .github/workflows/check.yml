name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: "1.7.0"
          node-version-file: .node-version
          cache: true

      - name: Run Check
        run: pnpm run check

      - name: Run Tests
        run: pnpm run test

      - name: Build packages
        run: pnpm build

      - name: Check JSR package
        run: pnpm exec jsr publish --dry-run --allow-slow-types
